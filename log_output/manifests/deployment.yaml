apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-files
          emptyDir: {}
      containers:
        - name: writer
          image: akoivul/log-output-writer:1.11
          volumeMounts:
            - name: shared-files
              mountPath: /files
        - name: reader
          image: akoivul/log-output-reader:2.1
          volumeMounts:
            - name: shared-files
              mountPath: /files