apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      volumes:
        - name: shared-files
          emptyDir: {}
        - name: config
          configMap:
            name: log-output-config
      containers:
        - name: writer
          image: akoivul/log-output-writer:1.11
          volumeMounts:
            - name: shared-files
              mountPath: /files
        - name: reader
          image: akoivul/log-output-reader:2.5
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: log-output-config
                  key: MESSAGE
          volumeMounts:
            - name: shared-files
              mountPath: /files
            - name: config
              mountPath: /config